name: CI

# PR では検証だけ、m への push では検証に通ったら
# サンプルサイトを GitHub Pages へデプロイし、ビルド済みライブラリを release ブランチへ置く
on:
  push:
    branches: [m]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run package
      - run: bun run lint:package
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/m'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # `npm i github:5ym/svelte-slider#release` のように直接インストールできるようにする
  release:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/m'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: dist
      - name: Commit to release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git ls-remote --exit-code --heads origin release >/dev/null; then
            git fetch origin release
            git worktree add -B release out origin/release
          else
            git worktree add --orphan -b release out
          fi

          # 利用側で不要な開発用の設定は落とす
          find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r dist README.md LICENSE out/
          jq 'del(.scripts, .devDependencies)' package.json > out/package.json

          cd out
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes in package output'
          else
            git commit -m "Build from ${GITHUB_SHA::7}"
            git push origin release
          fi

          # バージョンごとのタグ(未作成のときだけ)
          tag="v$(jq -r .version package.json)"
          if ! git ls-remote --exit-code --tags origin "$tag" >/dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi
