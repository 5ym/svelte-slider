name: Publish package to release branch

# ビルド済みライブラリを release ブランチへ置き、
# `npm i github:5ym/svelte-slider#release` のように直接インストールできるようにする
on:
  push:
    branches: [m]
    paths:
      - src/**
      - package.json
      - bun.lock
      - README.md
      - LICENSE
      - .github/workflows/package.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run package

      - name: Commit to release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git ls-remote --exit-code --heads origin release >/dev/null; then
            git fetch origin release
            git worktree add -B release out origin/release
          else
            git worktree add --orphan -b release out
          fi

          # 利用側で不要な開発用の設定は落とす
          find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r dist README.md LICENSE out/
          jq 'del(.scripts, .devDependencies)' package.json > out/package.json

          cd out
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes in package output'
          else
            git commit -m "Build from ${GITHUB_SHA::7}"
            git push origin release
          fi

          # バージョンごとのタグ(未作成のときだけ)
          tag="v$(jq -r .version package.json)"
          if ! git ls-remote --exit-code --tags origin "$tag" >/dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi
